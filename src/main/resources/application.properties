# Куди складати кеші (каталог, OFF-індекс, КБЖВ по штрихкодах)
fitcollector.data-dir=./data
# Свіжість каталогу цін; старіший — оновлюється у фоні при старті
fitcollector.catalog-ttl-hours=24
# Як часто перевіряти, чи не застарів кеш (мс)
fitcollector.refresh-check-millis=3600000
# Мережі, які додатково беремо з Open Prices (Biedronka йде зі скрапера)
fitcollector.stores=Lidl,Stokrotka,Żabka,Kaufland,Carrefour,Netto,Aldi,Dino,Auchan,E. Leclerc
# Скрапер zakupy.biedronka.pl
fitcollector.biedronka.throttle-millis=400
# OFF: пауза між product-запитами (ліміт 100/хв) і розмір індексу для матчингу
fitcollector.off.throttle-millis=700
fitcollector.off.cache-ttl-days=7
fitcollector.off.index-ttl-days=7
fitcollector.off.index-popular-pages=20
fitcollector.off.index-store-pages=15
fitcollector.open-prices.max-pages=30
fitcollector.user-agent=FitCollector/0.3 (https://github.com/Exocutorian/fitcollector)
