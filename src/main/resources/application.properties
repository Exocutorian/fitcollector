# Куди складати кеші (каталог, КБЖВ з OFF)
fitcollector.data-dir=./data
# Свіжість каталогу цін; старіший — оновлюється у фоні при старті
fitcollector.catalog-ttl-hours=24
# Як часто перевіряти, чи не застарів кеш (мс)
fitcollector.refresh-check-millis=3600000
# Мережі магазинів, які беремо з Open Prices (osm_brand локації)
fitcollector.stores=Biedronka,Lidl,Stokrotka,Żabka,Kaufland,Carrefour,Netto,Aldi,Dino,Auchan,E. Leclerc
# Пауза між запитами до OFF (ліміт 100/хв на product API)
fitcollector.off.throttle-millis=700
fitcollector.off.cache-ttl-days=7
fitcollector.open-prices.max-pages=30
fitcollector.user-agent=FitCollector/0.2 (https://github.com/Exocutorian/fitcollector)
